# StudentHub - Apache virtual host for XAMPP
# Add this to httpd-vhosts.conf (see docs/INSTALL_VHOST.md) and change the folder path.

# 1) keep localhost working (must be the first virtual host)
<VirtualHost *:80>
    ServerName localhost
    # macOS XAMPP:
    DocumentRoot "/Applications/XAMPP/xamppfiles/htdocs"
    # Windows XAMPP:  DocumentRoot "C:/xampp/htdocs"
</VirtualHost>

# 2) the StudentHub portal  ->  http://studenthub.local/
<VirtualHost *:80>
    ServerName studenthub.local
    ServerAlias www.studenthub.local

    # macOS XAMPP:
    DocumentRoot "/Applications/XAMPP/xamppfiles/htdocs/studenthub"
    # Windows XAMPP:  DocumentRoot "C:/xampp/htdocs/studenthub"

    <Directory "/Applications/XAMPP/xamppfiles/htdocs/studenthub">
    # Windows XAMPP:  <Directory "C:/xampp/htdocs/studenthub">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/studenthub-error.log"
    CustomLog "logs/studenthub-access.log" combined
</VirtualHost>
