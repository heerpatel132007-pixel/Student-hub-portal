<!DOCTYPE html>
<html>
<head>

    <title>My Profile</title>

    <style>

       
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#eef5ff;
        }

        
        .header{
            background:#073b8c;
            color:white;

            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:15px 50px;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
        }

        .menu a{
            color:white;
            text-decoration:none;

            border:1px solid white;
            padding:10px 25px;

            border-radius:6px;
            margin-left:10px;
        }

        .menu a:hover{
            background:white;
            color:#073b8c;
        }


       
        .container{
            width:80%;
            margin:40px auto;
        }


        
        h1{
            text-align:center;
            color:#073b8c;
            font-size:38px;
        }

        .line{
            width:70px;
            height:4px;
            background:#1976e8;
            margin:0 auto 30px;
        }


        
        .profile-box{
            background:white;
            width:600px;
            margin:auto;

            padding:30px;

            border-radius:12px;

            box-shadow:0 3px 12px #ccc;
        }


       
        .profile-icon{
            width:80px;
            height:80px;

            background:#287bea;
            color:white;

            border-radius:50%;

            margin:0 auto 25px;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:40px;
        }


        
        label{
            display:block;
            font-weight:bold;
            color:#073b8c;
            margin-top:15px;
            margin-bottom:5px;
        }

        input,
        textarea{
            width:100%;
            padding:12px;

            box-sizing:border-box;

            border:1px solid #ccc;
            border-radius:6px;

            font-size:15px;
        }

        textarea{
            height:80px;
        }


      
        .buttons{
            text-align:center;
            margin-top:25px;
        }

        button{
            padding:12px 25px;

            border:none;
            border-radius:6px;

            background:#1976e8;
            color:white;

            font-size:16px;

            margin:5px;

            cursor:pointer;
        }

        button:hover{
            background:#073b8c;
        }

        .clear{
            background:#777;
        }


       
        .back{
            display:block;
            text-align:center;

            margin-top:30px;

            color:#1976e8;

            text-decoration:none;

            font-weight:bold;
        }

        .back:hover{
            text-decoration:underline;
        }


        
        footer{
            background:#073b8c;
            color:white;

            text-align:center;

            padding:18px;

            margin-top:50px;
        }


       
        @media(max-width:700px){

            .profile-box{
                width:90%;
                box-sizing:border-box;
            }

            .header{
                padding:15px 20px;
            }

            .logo{
                font-size:22px;
            }

            .menu a{
                padding:8px 10px;
            }

        }

        .dark{
            background:#222;
            color:white;
        }

        .dark .header{
            background:#000;
        }

        .hamburger{
            display:none;
            background:none;
            border:none;
            color:white;
            font-size:22px;
            cursor:pointer;
        }

        @media(max-width:700px){
            .hamburger{
                display:block;
            }

            .menu a{
                display:none;
            }

            .menu.show a{
                display:block;
            }
        }

        .modal{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.6);
        }

        .modal-content{
            background:white;
            width:300px;
            margin:120px auto;
            padding:20px;
            border-radius:8px;
            text-align:center;
        }


        /* ========================= */
        /* THEME BUTTON */
        /* ========================= */

        .menu > button:first-of-type{
            width:50px !important;
            height:50px !important;

            padding:0 !important;

            margin-left:15px !important;

            border:none !important;
            border-radius:50% !important;

            background:white !important;

            color:#073b8c;

            font-size:25px !important;

            display:inline-flex !important;

            align-items:center !important;
            justify-content:center !important;

            cursor:pointer;

            vertical-align:middle;
        }

        .menu > button:first-of-type:hover{
            background:white !important;
            color:#073b8c !important;
        }


        /* ========================= */
        /* DARK MODE */
        /* ========================= */

        .dark h1{
            color:white;
        }

        .dark .profile-box{
            background:white;
            color:#222;
        }

        .dark .profile-box label{
            color:#073b8c;
        }

        .dark .profile-box input,
        .dark .profile-box textarea{
            background:white;
            color:#222;
        }

        .dark .back{
            color:#1976e8;
        }

        .dark .modal-content{
            background:white;
            color:#222;
        }

        .dark footer{
            background:#000;
        }

    </style>

</head>


<body>




<div class="header">

    <div class="logo">
        🎓 StudentHub
    </div>

    <div class="menu" id="nav">

        <a href="login.html">Login</a>

        <a href="dashboard.html">Dashboard</a>

        <button onclick="toggleTheme()">🌙</button>

        <button class="hamburger" onclick="toggleMenu()">☰</button>

    </div>

</div>



<div class="container">

    <h1>My Profile</h1>

    <div class="line"></div>


    <div class="profile-box">

        <div class="profile-icon">
            👤
        </div>


        <form onsubmit="showSaved(); return false;">

            <label>Name</label>
            <input type="text"
                   placeholder="Enter your name">


            <label>Student ID</label>
            <input type="text"
                   placeholder="Enter your Student ID">


            <label>Course</label>
            <input type="text"
                   placeholder="Enter your course">


            <label>Semester</label>
            <input type="number"
                   placeholder="Enter semester">


            <label>Email</label>
            <input type="email"
                   placeholder="Enter your email">


            <label>Phone Number</label>
            <input type="tel"
                   placeholder="Enter your phone number">


            <label>Address</label>
            <textarea
                placeholder="Enter your address">
            </textarea>


            <div class="buttons">

                <button type="submit">
                    Save Profile
                </button>

                <button type="reset" class="clear">
                    Clear
                </button>

            </div>

        </form>


        <a href="dashboard.html" class="back">
            ← Back to Dashboard
        </a>

    </div>

</div>




<footer>

    © 2026 StudentHub Portal. All rights reserved.

</footer>


<div class="modal" id="savedModal">
    <div class="modal-content">
        <h2>Saved!</h2>
        <p>Your profile has been saved.</p>
        <button onclick="closeModal()">OK</button>
    </div>
</div>


<script src="profile.js"></script>

</body>
</html>
