<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2>My Profile</h2>

    <form>

        <label>Name</label><br>
        <input type="text" placeholder="Enter your name"><br><br>

        <label>Student ID</label><br>
        <input type="text" placeholder="Enter your Student ID"><br><br>

        <label>Course</label><br>
        <input type="text" placeholder="Enter your course"><br><br>

        <label>Semester</label><br>
        <input type="number" placeholder="Enter semester"><br><br>

        <label>Email</label><br>
        <input type="email" placeholder="Enter your email"><br><br>

        <label>Phone Number</label><br>
        <input type="tel" placeholder="Enter your phone number"><br><br>

        <label>Address</label><br>
        <textarea placeholder="Enter your address"></textarea><br><br>

        <button type="submit">Save Profile</button>
        <button type="reset">Clear</button>

       
        <a href="dashboard.html">
            <button type="button">Dashboard</button>
        </a>

    </form>

</div>

</body>
</html>
