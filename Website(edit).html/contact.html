<!DOCTYPE html>
<html>

<head>

    <title>Contact Us</title>

    <style>

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#eef3ff;
        }

       
        .header{
            background:#0b2e73;
            color:white;

            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:15px 40px;
        }

        .header h2{
            margin:0;
            font-size:28px;
        }

        
        .header a{
            color:white;
            text-decoration:none;

            border:2px solid white;
            padding:8px 20px;

            border-radius:5px;
        }

        .header a:hover{
            background:white;
            color:#0b2e73;
        }

        
        .container{
            width:80%;
            max-width:600px;

            margin:50px auto;

            text-align:center;
        }

       
        h1{
            color:#0b2e73;
            font-size:38px;
        }

        .line{
            width:70px;
            height:4px;

            background:#1976e8;

            margin:0 auto 30px;
        }

        
        .form-box{
            background:white;

            padding:30px;

            border-radius:12px;

            box-shadow:0 3px 12px #ccc;

            text-align:left;
        }

        
        label{
            display:block;

            color:#0b2e73;

            font-weight:bold;

            margin-top:15px;
            margin-bottom:7px;
        }

        
        input,
        textarea{
            width:100%;

            padding:12px;

            box-sizing:border-box;

            border:1px solid #ccc;

            border-radius:6px;

            font-size:15px;

            font-family:Arial, sans-serif;
        }

        input:focus,
        textarea:focus{
            outline:none;

            border:2px solid #1976e8;
        }

        textarea{
            resize:none;
        }

        
        button{
            display:block;

            margin:25px auto 5px;

            background:#1976e8;

            color:white;

            border:none;

            padding:12px 35px;

            border-radius:6px;

            font-size:16px;

            cursor:pointer;
        }

        button:hover{
            background:#0b2e73;
        }

        
        .Home{
            display:block;

            text-align:center;

            margin-top:25px;

            color:#1976e8;

            text-decoration:none;

            font-weight:bold;
        }

        .Home:hover{
            text-decoration:underline;
        }

        
        footer{
            background:#0b2e73;

            color:white;

            text-align:center;

            padding:18px;

            margin-top:50px;
        }

    </style>

</head>


<body>



<div class="header">

    <h2>🎓 StudentHub</h2>

    <a href="index.html">
        Home
    </a>

</div>



<div class="container">

    <h1>Contact Us</h1>

    <div class="line"></div>


    <div class="form-box">

        <form>

            <label>Name</label>

            <input type="text"
                   placeholder="Enter your name">


            <label>Email</label>

            <input type="email"
                   placeholder="Enter your email">


            <label>Message</label>

            <textarea rows="5"
                      placeholder="Enter your message"></textarea>


            <button type="submit">
                Send Message
            </button>

        </form>


        <a href="index.html" class="Home">
            ← Back to Home
        </a>

    </div>

</div>




<footer>

    © 2026 StudentHub Portal. All Rights Reserved.

</footer>


</body>

</html>
