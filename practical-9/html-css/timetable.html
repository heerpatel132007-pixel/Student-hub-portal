<!DOCTYPE html>
<html>

<head>

    <title>Timetable</title>

    <style>

        
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#eef3ff;
        }

       
        .header{
            background:#0b2e73;
            color:white;

            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:15px 40px;
        }

        .header h2{
            margin:0;
            font-size:28px;
        }

       
        .header a{
            text-decoration:none;
            color:white;

            border:2px solid white;
            padding:8px 18px;

            border-radius:5px;
            margin-left:10px;
        }

        .header a:hover{
            background:white;
            color:#0b2e73;
        }

       
        .container{
            width:80%;
            margin:50px auto;
            text-align:center;
        }

        
        h1{
            color:#0b2e73;
            font-size:38px;
        }

        .line{
            width:70px;
            height:4px;
            background:#1976e8;

            margin:0 auto 30px;
        }

       
        table{
            width:80%;
            margin:auto;

            border-collapse:collapse;

            background:white;

            box-shadow:0 3px 10px #ccc;

            border-radius:8px;
            overflow:hidden;
        }

        
        th{
            background:#1565c0;
            color:white;

            padding:15px;

            font-size:18px;
        }

        
        td{
            padding:15px;

            border-bottom:1px solid #ddd;

            color:#333;
        }

       
        tr:nth-child(even){
            background:#f0f6ff;
        }

        tr:hover{
            background:#dceaff;
        }

        
        .dashboard{
            display:inline-block;

            margin-top:35px;

            background:#1565c0;
            color:white;

            text-decoration:none;

            padding:12px 30px;

            border-radius:6px;

            font-size:16px;
        }

        .dashboard:hover{
            background:#0b2e73;
        }

       
        footer{
            margin-top:50px;

            background:#0b2e73;
            color:white;

            text-align:center;

            padding:18px;
        }

        .dark{
            background:#222;
            color:white;
        }

        .dark .header{
            background:#000;
        }

        .hamburger{
            display:none;
            background:none;
            border:none;
            color:white;
            font-size:22px;
            cursor:pointer;
        }

        @media(max-width:700px){
            .hamburger{
                display:block;
            }

            #nav a{
                display:none;
            }

            #nav.show a{
                display:block;
            }
        }


        /* ========================= */
        /* THEME BUTTON */
        /* ========================= */

        #nav > button:first-of-type{
            width:50px !important;
            height:50px !important;

            padding:0 !important;

            margin-left:15px !important;

            border:none !important;
            border-radius:50% !important;

            background:white !important;

            color:#0b2e73;

            font-size:25px !important;

            display:inline-flex !important;

            align-items:center !important;
            justify-content:center !important;

            cursor:pointer;

            vertical-align:middle;
        }

        #nav > button:first-of-type:hover{
            background:white !important;
            color:#0b2e73 !important;
        }


        /* ========================= */
        /* DARK MODE */
        /* ========================= */

        .dark h1{
            color:white;
        }

        .dark table{
            background:white;
        }

        .dark td{
            color:#333;
        }

        .dark tr:nth-child(even){
            background:#f0f6ff;
        }

        .dark tr:hover{
            background:#dceaff;
        }

        .dark .dashboard{
            color:white;
        }

        .dark footer{
            background:#000;
        }

    </style>

</head>


<body>




<div class="header">

    <h2>🎓 StudentHub</h2>

    <div id="nav">

        <a href="login.html">Login</a>

        <a href="dashboard.html">Dashboard</a>

        <button onclick="toggleTheme()">🌙</button>

        <button class="hamburger" onclick="toggleMenu()">☰</button>

    </div>

</div>




<div class="container">

    <h1>Timetable</h1>

    <div class="line"></div>


    <table>

        <tr>
            <th>Day</th>
            <th>Subject</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>HTML</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>Java</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>Python</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>Database</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>Project</td>
        </tr>

    </table>


    <a href="dashboard.html" class="dashboard">
        ← Back to Dashboard
    </a>

</div>




<footer>

    © 2026 StudentHub Portal. All Rights Reserved.

</footer>


<script src="../js/timetable.js"></script>

</body>

</html>
