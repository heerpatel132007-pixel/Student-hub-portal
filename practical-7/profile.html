<!DOCTYPE html>
<html>
<head>

    <title>My Profile</title>

    <style>

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#eef5ff;
        }

        .header{
            background:#073b8c;
            color:white;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px 50px;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
        }

        .menu a{
            color:white;
            text-decoration:none;
            border:1px solid white;
            padding:10px 25px;
            border-radius:6px;
            margin-left:10px;
        }

        .menu a:hover{
            background:white;
            color:#073b8c;
        }

        .container{
            width:80%;
            margin:40px auto;
        }

        h1{
            text-align:center;
            color:#073b8c;
            font-size:38px;
        }

        .line{
            width:70px;
            height:4px;
            background:#1976e8;
            margin:0 auto 30px;
        }

        .profile-box{
            background:white;
            width:600px;
            margin:auto;
            padding:30px;
            border-radius:12px;
            box-shadow:0 3px 12px #ccc;
        }

        .profile-icon{
            width:80px;
            height:80px;
            background:#287bea;
            color:white;
            border-radius:50%;
            margin:0 auto 25px;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:40px;
        }

        label{
            display:block;
            font-weight:bold;
            color:#073b8c;
            margin-top:15px;
            margin-bottom:5px;
        }

        input,
        textarea,
        select{
            width:100%;
            padding:12px;
            box-sizing:border-box;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }

        textarea{
            height:80px;
        }

        .gender{
            display:flex;
            gap:20px;
            margin-top:8px;
        }

        .gender label{
            margin:0;
            font-weight:normal;
            color:#333;
        }

        .gender input{
            width:auto;
        }

        .terms{
            display:flex;
            align-items:center;
            gap:8px;
            margin-top:20px;
        }

        .terms input{
            width:auto;
        }

        .terms label{
            margin:0;
            font-weight:normal;
            color:#333;
        }

        .error{
            color:red;
            font-size:13px;
            margin-top:4px;
        }

        .buttons{
            text-align:center;
            margin-top:25px;
        }

        button{
            padding:12px 25px;
            border:none;
            border-radius:6px;
            background:#1976e8;
            color:white;
            font-size:16px;
            margin:5px;
            cursor:pointer;
        }

        button:hover{
            background:#073b8c;
        }

        .clear{
            background:#777;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:30px;
            color:#1976e8;
            text-decoration:none;
            font-weight:bold;
        }

        .back:hover{
            text-decoration:underline;
        }

        footer{
            background:#073b8c;
            color:white;
            text-align:center;
            padding:18px;
            margin-top:50px;
        }

        /* DARK MODE */

        .dark{
            background:#222;
            color:white;
        }

        .dark .header{
            background:#000;
        }

        .dark h1{
            color:white;
        }

        .dark .profile-box{
            background:white;
            color:#222;
        }

        .dark .profile-box label{
            color:#073b8c;
        }

        .dark .profile-box input,
        .dark .profile-box textarea,
        .dark .profile-box select{
            background:white;
            color:#222;
        }

        .dark .gender label,
        .dark .terms label{
            color:#333;
        }

        .dark .back{
            color:#1976e8;
        }

        .dark footer{
            background:#000;
        }

        /* THEME BUTTON */

        .menu > button:first-of-type{
            width:50px !important;
            height:50px !important;
            padding:0 !important;
            margin-left:15px !important;
            border:none !important;
            border-radius:50% !important;
            background:white !important;
            color:#073b8c;
            font-size:25px !important;
            display:inline-flex !important;
            align-items:center !important;
            justify-content:center !important;
            cursor:pointer;
            vertical-align:middle;
        }

        .menu > button:first-of-type:hover{
            background:white !important;
            color:#073b8c !important;
        }

        /* HAMBURGER */

        .hamburger{
            display:none;
            background:none;
            border:none;
            color:white;
            font-size:22px;
            cursor:pointer;
        }

        /* MODAL */

        .modal{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.6);
        }

        .modal-content{
            background:white;
            width:300px;
            margin:120px auto;
            padding:20px;
            border-radius:8px;
            text-align:center;
        }

        /* MOBILE */

        @media(max-width:700px){

            .profile-box{
                width:90%;
                box-sizing:border-box;
            }

            .header{
                padding:15px 20px;
            }

            .logo{
                font-size:22px;
            }

            .menu a{
                display:none;
                padding:8px 10px;
            }

            .hamburger{
                display:block;
            }

            .menu.show a{
                display:block;
            }

        }

    
        /* ========================= */
        /* DYNAMIC DATA (FETCH)      */
        /* ========================= */

        .dl-title{
            color:#0b2e73;
            font-size:30px;
            margin:50px 0 10px;
            text-align:center;
        }

        .dl-line{
            width:60px;
            height:4px;
            background:#1976e8;
            margin:0 auto 20px;
            border-radius:5px;
        }

        .dl-toolbar{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            justify-content:center;
            width:100%;
            max-width:700px;
            margin:20px auto;
        }

        .dl-toolbar input,
        .dl-toolbar select{
            padding:10px 12px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
            background:white;
            color:#222;
            box-sizing:border-box;
            width:auto;
        }

        .dl-toolbar input{
            flex:1;
            min-width:160px;
        }

        .dl-msg{
            color:#555;
            padding:20px;
            text-align:center;
        }

        .dl-pager{
            text-align:center;
            margin-top:20px;
        }

        .dl-pager button{
            display:inline-block;
            margin:3px;
            padding:8px 14px;
            border:none;
            border-radius:6px;
            background:#1976e8;
            color:white;
            font-size:15px;
            cursor:pointer;
        }

        .dl-pager button:hover{
            background:#073b8c;
        }

        .dl-pager button.active{
            background:#073b8c;
        }

        .dl-pager button:disabled{
            opacity:0.5;
            cursor:default;
        }

        .dl-info{
            display:block;
            margin-top:10px;
            font-size:14px;
            color:#555;
        }

        .dark .dl-title{
            color:white;
        }

        .dark .dl-info{
            color:#ddd;
        }

        .dark .dl-msg{
            color:#ddd;
        }

        .dark .faq .dl-msg{
            color:#555;
        }

        /* Student directory */

        .directory{
            margin-top:20px;
        }

        .student-grid{
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
            gap:20px;
        }

        .student-grid .dl-msg{
            grid-column:1 / -1;
        }

        .student-card{
            background:white;
            padding:20px;
            border-radius:12px;
            text-align:center;
            box-shadow:0 3px 12px #ccc;
            color:#222;
        }

        .student-avatar{
            width:60px;
            height:60px;
            margin:0 auto 10px;
            border-radius:50%;
            background:#287bea;
            color:white;
            font-size:26px;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .student-card h3{
            margin:5px 0;
            color:#073b8c;
        }

        .student-card p{
            margin:4px 0;
            font-size:14px;
            color:#555;
            word-break:break-all;
        }

    </style>

</head>

<body>


<div class="header">

    <div class="logo">
        🎓 StudentHub
    </div>

    <div class="menu" id="nav">

        <a href="login.html">Login</a>

        <a href="dashboard.html">Dashboard</a>

        <button onclick="toggleTheme()">🌙</button>

        <button class="hamburger"
                onclick="toggleMenu()">☰</button>

    </div>

</div>


<div class="container">

    <h1>My Profile</h1>

    <div class="line"></div>


    <div class="profile-box">

        <div class="profile-icon">
            👤
        </div>


        <form onsubmit="return validateForm()">


            <label>Name</label>

            <input type="text"
                   id="name"
                   placeholder="Enter your name">

            <div id="nameError" class="error"></div>


            <label>Student ID</label>

            <input type="text"
                   id="studentId"
                   placeholder="Enter your Student ID">


            <label>Course</label>

            <select id="course">

                <option value="">Select Course</option>

                <option value="CSE">
                    Computer Science Engineering
                </option>

                <option value="IT">
                    Information Technology
                </option>

                <option value="CE">
                    Computer Engineering
                </option>

                <option value="DS">
                    Data Science
                </option>

            </select>

            <div id="courseError" class="error"></div>


            <label>Year</label>

            <select id="year">

                <option value="">Select Year</option>

                <option value="1">1st Year</option>

                <option value="2">2nd Year</option>

                <option value="3">3rd Year</option>

                <option value="4">4th Year</option>

            </select>

            <div id="yearError" class="error"></div>


            <label>Semester</label>

            <input type="number"
                   id="semester"
                   placeholder="Enter semester">


            <label>Email</label>

            <input type="email"
                   id="email"
                   placeholder="Enter your email">

            <div id="emailError" class="error"></div>


            <label>Mobile Number</label>

            <input type="tel"
                   id="mobile"
                   placeholder="Enter 10-digit mobile number">

            <div id="mobileError" class="error"></div>


            <label>Password</label>

            <input type="password"
                   id="password"
                   placeholder="Enter password">

            <div id="passwordError" class="error"></div>


            <label>Confirm Password</label>

            <input type="password"
                   id="confirmPassword"
                   placeholder="Confirm password">

            <div id="confirmPasswordError" class="error"></div>


            <label>Gender</label>

            <div class="gender">

                <label>
                    <input type="radio"
                           name="gender"
                           value="Male">
                    Male
                </label>

                <label>
                    <input type="radio"
                           name="gender"
                           value="Female">
                    Female
                </label>

                <label>
                    <input type="radio"
                           name="gender"
                           value="Other">
                    Other
                </label>

            </div>

            <div id="genderError" class="error"></div>


            <label>Address</label>

            <textarea id="address"
                      placeholder="Enter your address"></textarea>


            <div class="terms">

                <input type="checkbox"
                       id="terms">

                <label for="terms">
                    I accept the terms and conditions
                </label>

            </div>

            <div id="termsError" class="error"></div>


            <div class="buttons">

                <button type="submit">
                    Save Profile
                </button>

                <button type="reset"
                        class="clear"
                        onclick="clearErrors()">
                    Clear
                </button>

            </div>

        </form>


        <a href="dashboard.html" class="back">
            ← Back to Dashboard
        </a>

    </div>


    <div class="directory">

        <h2 class="dl-title">Student Directory</h2>

        <div class="dl-line"></div>

        <div class="dl-toolbar">
        <input type="text" id="student-search" placeholder="Search by name, ID or email...">
        <select id="student-filter"><option value="all">All Courses</option></select>
        <select id="student-sort"><option value="name:asc">Name (A-Z)</option><option value="name:desc">Name (Z-A)</option><option value="year:asc">Year (low to high)</option><option value="year:desc">Year (high to low)</option></select>
    </div>

        <div class="student-grid" id="student-list"></div>

        <div class="dl-pager" id="student-pager"></div>

    </div>

</div>


<footer>

    © 2026 StudentHub Portal. All rights reserved.

</footer>


<div class="modal" id="savedModal">

    <div class="modal-content">

        <h2 id="savedTitle">Saved!</h2>

        <p id="savedText">Your profile has been saved.</p>

        <button onclick="closeModal()">OK</button>

    </div>

</div>


<script src="datalist.js"></script>
<script src="profile.js"></script>

</body>
</html>
